name: Harness iOS (TSan)

on:
  pull_request:
    paths:
      - ".github/workflows/harness-ios-tsan.yml"
      - "example/ios/**"
      - "packages/react-native-nitro-modules/cpp/**"
      - "packages/react-native-nitro-test/cpp/**"
      - "packages/react-native-nitro-test/ios/**"
      - "**/nitrogen/generated/shared/**"
      - "**/nitrogen/generated/ios/**"
      - "example/__tests__/**"
      - "example/src/getTests.ts"
      - "example/src/testing/**"
      - "example/jest.harness.config.mjs"
      - "example/package.json"
      - "example/rn-harness.config.mjs"
      - "**/bun.lock"
      - "**/Podfile.lock"
      - "**/*.podspec"

env:
  DEVICE_MODEL: "iPhone 17 Pro"
  IOS_VERSION: "26.5"
  XCODE_VERSION: "26.5"
  DEVELOPER_DIR: /Applications/Xcode_26.5.app/Contents/Developer
  HARNESS_DEBUG: 1
  # Forwarded by simctl to the iOS app process — makes TSan crash on first race
  SIMCTL_CHILD_TSAN_OPTIONS: "halt_on_error=1"

jobs:
  harness_ios_tsan:
    name: Harness iOS TSan (race detection)
    runs-on: macOS-26
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - uses: oven-sh/setup-bun@v2

      - name: Install npm dependencies (bun)
        run: bun install

      - name: Setup Ruby (bundle)
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 2.7.2
          bundler-cache: true
          working-directory: example

      - name: Select Xcode ${{ env.XCODE_VERSION }}
        run: sudo xcode-select -s "/Applications/Xcode_${{ env.XCODE_VERSION }}.app/Contents/Developer"

      - name: Install Pods
        working-directory: example
        run: bun pods

      - name: Build iOS app (Thread Sanitizer enabled)
        working-directory: example/ios
        run: |
          set -o pipefail
          xcodebuild \
            -enableThreadSanitizer YES \
            -derivedDataPath build -UseModernBuildSystem=YES \
            -workspace NitroExample.xcworkspace \
            -scheme NitroExample \
            -sdk iphonesimulator \
            -configuration Debug \
            -destination 'platform=iOS Simulator,arch=arm64,name=${{ env.DEVICE_MODEL }}' \
            ONLY_ACTIVE_ARCH=YES \
            build \
            CODE_SIGNING_ALLOWED=NO | xcbeautify --renderer github-actions

      - name: Install Watchman
        run: brew install watchman

      - name: Run Harness E2E tests
        # App is built with TSan; SIMCTL_CHILD_TSAN_OPTIONS forwards halt_on_error=1
        # into the simulator process so any detected race crashes the app → harness fails.
        uses: callstackincubator/react-native-harness@v1.2.0
        with:
          runner: ios
          projectRoot: example
          app: ios/build/Build/Products/Debug-iphonesimulator/NitroExample.app
          packageManager: bun
